name: Unity Call validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Typecheck backend
        run: npx tsc --noEmit --project server/tsconfig.json
      - name: Typecheck frontend
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: HTTP security integration tests
        if: always()
        run: node --experimental-strip-types --test server/src/http.test.ts
      - name: Guest room integration tests
        if: always()
        run: node --experimental-strip-types --test server/src/guest.test.ts
      - name: Privacy and authorization regression tests
        if: always()
        run: node --experimental-strip-types --test server/src/security.test.ts
      - name: Isolated backend self-check
        if: always()
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        run: npm run test:e2e
      - name: Build
        if: always()
        run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit frontend dependency lockfile
        run: npm audit --audit-level=high
      - name: Audit backend dependency lockfile
        if: always()
        run: npm audit --prefix server --audit-level=high
      - name: Scan source, configuration and secrets
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
