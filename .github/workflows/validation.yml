name: Unity Call validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install server dependencies
        run: npm install --prefix server --no-package-lock
      - name: Typecheck backend
        run: npx tsc --noEmit --project server/tsconfig.json
      - name: Typecheck frontend
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: HTTP security integration tests
        if: always()
        run: node --experimental-strip-types --test server/src/http.test.ts
      - name: Guest room integration tests
        if: always()
        run: node --experimental-strip-types --test server/src/guest.test.ts
      - name: Isolated backend self-check
        if: always()
        run: npm test
      - name: Build
        if: always()
        run: npm run build
