<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#0f766e"/>
  <title>Unity Call — Offline</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f7faf9; color: #17312e; margin: 0; padding: 2rem; line-height: 1.5; }
    main { max-width: 38rem; margin: 8vh auto; padding: 2rem; background: #fff; border-radius: 1rem; box-shadow: 0 4px 18px #0001; }
    button { background: #0f766e; border: 0; border-radius: .6rem; color: white; padding: .9rem 1.2rem; font: inherit; min-height: 48px; }
  </style>
</head>
<body><main><h1>You're offline</h1>
  <p>Unity Call needs a network connection to securely load conversations, calls, and account information. Private messages and media are never stored in the offline page cache.</p>
  <p>Reconnect to Wi-Fi or mobile data, then try again.</p>
  <button onclick="window.location.reload()">Try again</button>
</main></body></html>
